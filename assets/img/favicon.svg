<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="DS monogram mark">
  <title>Dweep Shishodia — DS mark</title>
  <!-- Colours are literal here because a favicon is fetched outside the
       page and cannot read tokens.css: they are the coral and ink tokens,
       kept in step with that file. Border width (3) matches the site's
       standard rule weight so the mark reads like the cards and chips. -->
  <rect x="1.5" y="1.5" width="37" height="37" fill="#FF5A3C" stroke="#0A0A0A" stroke-width="3"/>
  <!-- The horizontal scale condenses the glyphs regardless of whether
       Archivo is available in the context a favicon renders in (browser
       chrome often skips webfonts), so the mark stays condensed-and-heavy
       even on the system-ui fallback. -->
  <g transform="translate(20 21.5) scale(0.86 1) translate(-20 -21.5)">
    <text x="20" y="21.5" text-anchor="middle" dominant-baseline="central"
          font-family="Archivo, 'Arial Narrow', system-ui, sans-serif"
          font-weight="900" font-size="21" letter-spacing="-0.5"
          fill="#0A0A0A">DS</text>
  </g>
</svg>
